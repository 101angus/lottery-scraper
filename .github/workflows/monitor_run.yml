name: Monitor Betting Stations

on:
  schedule:
    # 台灣時間 08:30 執行 (UTC 00:30)
    # 跟刮刮樂錯開半小時比較保險
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 雖然這個腳本不需要 Playwright 瀏覽器，但為了保持環境一致或避免 requirements 報錯，
      # 我們還是留著安裝步驟，或者只執行 install dependencies 其實就夠了。
      # 為了簡單，這裡只保留 pip install 即可，不需要 playwright install browser
      
      - name: Run Monitor
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python monitor.py
